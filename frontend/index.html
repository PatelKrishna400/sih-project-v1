<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot — Factory & Machine Assistant</title>
  <meta name="description" content="Clean, simple conversational AI chatbot for workers with chat history, attachment menu, and instant replies.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Left Sidebar Menu -->
  <aside class="sidebar" id="sidebar">
    <!-- Top Brand & New Chat -->
    <div class="sidebar-header">
      <div class="project-brand">
        <div class="project-icon">💬</div>
        <div class="project-title">PLANT AI</div>
      </div>

      <button class="btn-new-chat" id="btn-new-chat">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <!-- History Section -->
    <div class="history-container" id="history-list">
      <div class="history-label">Chat History</div>
      <div id="empty-history-msg" style="padding: 12px 10px; font-size: 0.8rem; color: var(--text-dim); font-style: italic;">
        No recent chats.
      </div>
    </div>

    <!-- Bottom Login / Profile Button -->
    <div class="sidebar-footer">
      <button class="btn-login" id="btn-login">
        <div class="avatar-badge">👤</div>
        <div style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2;">
          <span style="font-size: 0.85rem;" id="user-display-name">Worker Profile</span>
          <span style="font-size: 0.72rem; color: var(--accent-emerald);">● Shift Active (Login)</span>
        </div>
      </button>
    </div>
  </aside>

  <!-- Main Chat Canvas -->
  <main class="main-wrapper">
    <!-- Mobile Toggle Header -->
    <div class="mobile-header">
      <button class="btn-menu-toggle" id="btn-mobile-toggle">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span style="font-weight: 700; font-size: 0.95rem;">PLANT AI</span>
      <span style="font-size: 0.75rem; color: var(--accent-emerald);">🔒 Local</span>
    </div>

    <!-- Chat Messages Stream & Clean Hero -->
    <div class="chat-scroll-area" id="chat-area">
      <!-- Clean Hero State (Shown when empty) -->
      <div class="hero-center" id="hero-state">
        <div class="hero-logo">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <div class="hero-title">How can I help you today?</div>
        <p class="hero-subtitle">Ask anything about machines, factory operations, or upload files & folders using (+).</p>
      </div>
    </div>

    <!-- Center Search / Text Bar (Bottom Floating) -->
    <div class="center-input-container">
      <div class="search-bar-wrapper">
        <!-- Plus Icon for Attachments -->
        <button class="btn-plus-attach" id="btn-plus-attach" title="Attach file, folder, or link">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>

        <!-- Plus Dropdown Menu -->
        <div class="attach-menu-dropdown" id="attach-menu">
          <label class="attach-menu-item">
            <svg width="16" height="16" fill="none" stroke="var(--accent-amber)" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span>Upload File (.pdf, .txt)</span>
            <input type="file" id="file-input" style="display: none;">
          </label>

          <label class="attach-menu-item">
            <svg width="16" height="16" fill="none" stroke="var(--accent-cyan)" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <span>Upload Folder (Directory)</span>
            <input type="file" id="folder-input" webkitdirectory directory multiple style="display: none;">
          </label>

          <div class="attach-menu-item" id="btn-add-link">
            <svg width="16" height="16" fill="none" stroke="var(--accent-emerald)" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>Add Web / Intranet Link</span>
          </div>
        </div>

        <!-- Center Search Text Box -->
        <input type="text" id="search-input" class="main-search-input" placeholder="Type a message or question..." autocomplete="off">

        <!-- Microphone Voice Button -->
        <button class="btn-action-icon" id="btn-voice" title="Speak message">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="23"/><line x1="8" x2="16" y1="23" y2="23"/></svg>
        </button>

        <!-- Send Button -->
        <button class="btn-search-send" id="btn-send" title="Send">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
